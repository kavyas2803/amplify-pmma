version: 1

frontend:
  phases:
    preBuild:
      commands:
        - cd gl-tax-classification
        - npm ci

    build:
      commands:
        - cd gl-tax-classification
        - npm run build

  artifacts:
    baseDirectory: gl-tax-classification/dist
    files:
      - '**/*'

  cache:
    paths:
      - gl-tax-classification/node_modules/**/*